events {
    worker_connections 1024;
}

http {
    upstream backend {
        server backend:5001;
    }

    upstream frontend {
        server frontend:3000;
    }

    upstream saby-service {
        server saby-service:8080;
    }

    upstream vk-mini-app {
        server vk-mini-app:80;
    }

    # Редирект с HTTP на HTTPS и с www на без www
    server {
        listen 80;
        server_name sushiritto.ru www.sushiritto.ru;

        # Location для проверки Let's Encrypt (ACME challenge)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Редирект www на без www
        if ($host = 'www.sushiritto.ru') {
            return 301 https://sushiritto.ru$request_uri;
        }

        # Редирект HTTP на HTTPS
        location / {
            return 301 https://sushiritto.ru$request_uri;
        }
    }

    # HTTPS сервер
    server {
        listen 443 ssl;
        http2 on;
        server_name sushiritto.ru www.sushiritto.ru;

        # Редирект www на без www
        if ($host = 'www.sushiritto.ru') {
            return 301 https://sushiritto.ru$request_uri;
        }

        # SSL сертификаты Let's Encrypt
        ssl_certificate /etc/letsencrypt/live/sushiritto.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/sushiritto.ru/privkey.pem;

        # Рекомендуемые настройки SSL от Reg.ru
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers off;
        
        # HSTS (опционально, раскомментируйте после проверки работы SSL)
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Дополнительные заголовки безопасности
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Catalog API - проксируем на saby-service
        location ~ ^/api/catalog(/.*)?$ {
            proxy_pass http://saby-service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_redirect off;
        }

        # Backend API - должен быть ПЕРЕД location / для приоритета
        location ~ ^/api(/.*)?$ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_redirect off;
            
            # 🍪 Передача cookies между клиентом и бэкендом
            proxy_set_header Cookie $http_cookie;
            proxy_pass_header Set-Cookie;
            
            # Добавляем заголовки для отладки //TODO убрать после отладки!
            add_header X-Debug-Backend "backend:5001" always;
            add_header X-Debug-Request-Uri $request_uri always;
        }

        # Backend Uploads
        location /uploads/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # VK Mini App - serve at /vk path
        location /vk {
            proxy_pass http://vk-mini-app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # CORS headers for VK platform
            add_header Access-Control-Allow-Origin "https://vk.com" always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Request-ID" always;
            add_header Access-Control-Allow-Credentials "true" always;
            
            # Handle preflight requests
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin "https://vk.com" always;
                add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Request-ID" always;
                add_header Access-Control-Allow-Credentials "true" always;
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }
        }

        # Static files
        location /static/ {
            alias /app/static/;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Frontend - должен быть последним
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
