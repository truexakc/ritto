version: '3.8'

services:
  # PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: ritto-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./back/migrations:/docker-entrypoint-initdb.d
    networks:
      - ritto-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  # Backend
  backend:
    build:
      context: ./back
      dockerfile: Dockerfile
    container_name: ritto-backend
    ports:
      - "5001:5001"
    volumes:
      # Используем named volume для избежания проблем с правами
      # Альтернатива: ./back/public/uploads:/app/public/uploads
      - uploads_data:/app/public/uploads
    environment:
      - NODE_ENV=production
      - DEBUG=false
      - PORT=5001
      - CLIENT_URL=${CLIENT_URL}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_NAME=${POSTGRES_DB}
    env_file:
      - ./.env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ritto-network
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  # Frontend
  frontend:
    build:
      context: ./front
      dockerfile: Dockerfile
    container_name: ritto-frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=/api
    networks:
      - ritto-network
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  # VK Mini App (DISABLED)
  # vk-mini-app:
  #   build:
  #     context: ./vk-mini-app
  #     dockerfile: Dockerfile
  #   container_name: ritto-vk-mini-app
  #   ports:
  #     - "3001:80"
  #   volumes:
  #     # Volume mount for development (hot reload)
  #     - ./vk-mini-app/src:/app/src
  #     - ./vk-mini-app/public:/app/public
  #   environment:
  #     - VITE_VK_APP_ID=${VK_APP_ID}
  #     - VITE_BACKEND_API_URL=${VK_BACKEND_API_URL:-https://sushiritto.ru}
  #     - VITE_SABY_SERVICE_URL=${VK_SABY_SERVICE_URL:-https://sushiritto.ru}
  #   networks:
  #     - ritto-network
  #   restart: unless-stopped
  #   security_opt:
  #     - no-new-privileges:true

  nginx:
    image: nginx:alpine
    container_name: ritto-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - frontend
      - backend
      # - vk-mini-app
    networks:
      - ritto-network
    restart: unless-stopped

  # Certbot для автоматического обновления сертификатов
  certbot:
    image: certbot/certbot
    container_name: ritto-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - ritto-network

  # SABY Go Microservice
  saby-service:
    build:
      context: ./saby-service
      dockerfile: Dockerfile
    container_name: ritto-saby-service
    ports:
      - "8080:8080"
    volumes:
      # Share the same uploads directory with backend for images
      - uploads_data:/app/public/uploads
    environment:
      # Database connection (using postgres service)
      - DB_CONNECTION_STRING=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      # Image storage path inside container (same as backend)
      - IMAGE_STORAGE_PATH=/app/public/uploads/products
      # Import configuration
      - SBIS_ACCESS_TOKEN=${SBIS_ACCESS_TOKEN}
      - SBIS_POINT_ID=${SBIS_POINT_ID}
      - SBIS_PRICE_LIST_ID=${SBIS_PRICE_LIST_ID}
      - IMPORT_PAGE_SIZE=${IMPORT_PAGE_SIZE:-100}
      - IMPORT_SCHEDULE=${IMPORT_SCHEDULE:-0 3 * * *}
      - IMPORT_TIMEOUT=${IMPORT_TIMEOUT:-30m}
      - MAX_PAGINATION_PAGES=${MAX_PAGINATION_PAGES:-1000}
      - ENABLE_SCHEDULER=${ENABLE_SCHEDULER:-true}
    env_file:
      - ./saby-service/.env
    networks:
      - ritto-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  # Adminer - веб-интерфейс для управления PostgreSQL
  adminer:
    image: adminer:latest
    container_name: ritto-adminer
    ports:
      - "8081:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=postgres
    networks:
      - ritto-network
    depends_on:
      - postgres
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  # Portainer - мониторинг и управление Docker
  portainer:
    image: portainer/portainer-ce:latest
    container_name: ritto-portainer
    ports:
      - "9000:9000"
      - "9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - ritto-network
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  # Monitor Service - мониторинг контейнеров и отправка алертов в Telegram
  monitor-service:
    build:
      context: ./monitor-service
      dockerfile: Dockerfile
    container_name: ritto-monitor
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    env_file:
      - ./monitor-service/.env
    networks:
      - ritto-network
    depends_on:
      - backend
      - frontend
      - saby-service
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

networks:
  ritto-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  portainer_data:
    driver: local
  uploads_data:
    driver: local
